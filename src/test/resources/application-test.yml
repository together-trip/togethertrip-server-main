spring:
  batch:
    job:
      enabled: false

  sql:
    init:
      mode: never

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    defer-datasource-initialization: false
    hibernate:
      ddl-auto: validate
    show-sql: false

jwt:
  secret: test-secret-key-must-be-at-least-32-bytes-long
  issuer: together-trip
  access-token-expiration: 1800
  refresh-token-expiration: 1209600

auth:
  local-test:
    enabled: false

springdoc:
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
  api-docs:
    enabled: false
    path: /v3/api-docs

post:
  attachments:
    local-storage-path: ./build/test-uploads/post-attachments
    public-url-prefix: /uploads/post-attachments

user:
  profile-images:
    local-storage-path: ./build/test-uploads/user-profile-images
    public-url-prefix: /uploads/user-profile-images

trip:
  invite:
    base-url: https://togethertrip.test/invites

trip-recap:
  ai:
    provider: stub
    openai:
      api-key: ""
  images:
    storage-dir: ./build/test-uploads/trip-recaps
    public-url-prefix: /uploads/trip-recaps

exchange-rate:
  korea-exim:
    base-url: https://oapi.koreaexim.go.kr/site/program/financial/exchangeJSON
    auth-key: test-korea-exim-auth-key
    data-code: AP01
    timeout: 10s
  import-validation:
    minimum-row-count: 20
    required-currencies: USD,JPY,EUR
    skip-weekends: true
  scheduler:
    enabled: false
    cron: 0 30 11 * * *
    catch-up-days: 7
  backfill:
    enabled: false
    from: 2017-01-01
    to: 2026-12-31
    pause-between-requests: 300ms
  lock:
    name: exchange-rate:import:korea-exim
    wait-time: 0s
    lease-time: 10m

notification:
  sqs:
    queue-url: ""
    region: ap-northeast-2
    enabled: false
    access-key-id: ""
    secret-access-key: ""
    session-token: ""

outbox:
  dispatch:
    enabled: false
    fixed-delay: PT3S
    limit: 50
    max-attempts: 5

server:
  port: 8081

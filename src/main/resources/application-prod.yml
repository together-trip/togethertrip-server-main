spring:
  config:
    import:
      - optional:classpath:secret.yml

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${SPRING_REDIS_HOST}
      port: ${SPRING_REDIS_PORT}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

  sql:
    init:
      mode: never

  servlet:
    multipart:
      max-file-size: ${POST_ATTACHMENT_MAX_FILE_SIZE:10MB}
      max-request-size: ${POST_ATTACHMENT_MAX_REQUEST_SIZE:50MB}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

jwt:
  secret: ${JWT_SECRET}
  issuer: together-trip
  access-token-expiration: 1800
  refresh-token-expiration: 1209600

phone:
  hash:
    key: ${PHONE_HASH_KEY}
    version: ${PHONE_HASH_VERSION:v1}

sms:
  solapi:
    base-url: ${SOLAPI_BASE_URL:https://api.solapi.com}

post:
  attachments:
    local-storage-path: ${POST_ATTACHMENT_LOCAL_STORAGE_PATH:/var/togethertrip/uploads/post-attachments}
    public-url-prefix: ${POST_ATTACHMENT_PUBLIC_URL_PREFIX:/uploads/post-attachments}

trip:
  invite:
    base-url: ${TRIP_INVITE_BASE_URL:https://togethertrip.app/invites}

exchange-rate:
  korea-exim:
    base-url: ${KOREA_EXIM_EXCHANGE_RATE_BASE_URL:https://oapi.koreaexim.go.kr/site/program/financial/exchangeJSON}
    auth-key: ${KOREA_EXIM_EXCHANGE_RATE_AUTH_KEY:}
    data-code: ${KOREA_EXIM_EXCHANGE_RATE_DATA_CODE:AP01}
    timeout: ${KOREA_EXIM_EXCHANGE_RATE_TIMEOUT:10s}
  import-validation:
    minimum-row-count: ${EXCHANGE_RATE_IMPORT_MINIMUM_ROW_COUNT:20}
    required-currencies: ${EXCHANGE_RATE_IMPORT_REQUIRED_CURRENCIES:USD,JPY,EUR}
    skip-weekends: ${EXCHANGE_RATE_IMPORT_SKIP_WEEKENDS:true}
  scheduler:
    enabled: ${EXCHANGE_RATE_SCHEDULER_ENABLED:false}
    cron: ${EXCHANGE_RATE_SCHEDULER_CRON:0 30 11 * * *}
    catch-up-days: ${EXCHANGE_RATE_SCHEDULER_CATCH_UP_DAYS:7}
  backfill:
    enabled: ${EXCHANGE_RATE_BACKFILL_ENABLED:false}
    from: ${EXCHANGE_RATE_BACKFILL_FROM:}
    to: ${EXCHANGE_RATE_BACKFILL_TO:}
    pause-between-requests: ${EXCHANGE_RATE_BACKFILL_PAUSE_BETWEEN_REQUESTS:300ms}
  lock:
    name: ${EXCHANGE_RATE_LOCK_NAME:exchange-rate:import:korea-exim}
    wait-time: ${EXCHANGE_RATE_LOCK_WAIT_TIME:0s}
    lease-time: ${EXCHANGE_RATE_LOCK_LEASE_TIME:10m}

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

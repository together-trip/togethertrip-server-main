spring:
  config:
    import:
      - optional:classpath:secret.yml

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/together_trip}
    username: ${SPRING_DATASOURCE_USERNAME:together_trip}
    password: ${SPRING_DATASOURCE_PASSWORD:together_trip}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${SPRING_REDIS_HOST:127.0.0.1}
      port: ${SPRING_REDIS_PORT:6379}

  sql:
    init:
      mode: never

  servlet:
    multipart:
      max-file-size: ${POST_ATTACHMENT_MAX_FILE_SIZE:10MB}
      max-request-size: ${POST_ATTACHMENT_MAX_REQUEST_SIZE:50MB}

  flyway:
    enabled: true
    locations:
      - classpath:db/migration
      - classpath:db/local
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    defer-datasource-initialization: false
    hibernate:
      ddl-auto: validate
    show-sql: true

jwt:
  secret: ${JWT_SECRET:local-development-secret-key-at-least-32-bytes}
  issuer: together-trip
  access-token-expiration: 1800
  refresh-token-expiration: 1209600

auth:
  local-test:
    enabled: true

sms:
  solapi:
    base-url: ${SOLAPI_BASE_URL:https://api.solapi.com}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

post:
  attachments:
    local-storage-path: ${POST_ATTACHMENT_LOCAL_STORAGE_PATH:./uploads/post-attachments}
    public-url-prefix: ${POST_ATTACHMENT_PUBLIC_URL_PREFIX:/uploads/post-attachments}
